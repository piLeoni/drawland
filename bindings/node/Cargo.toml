[package]
name = "drawland-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
drawland = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
