# Tests, then the packages for every platform: the Python wheels and the
# Node addons. Nothing is published here: the packages are the run's
# artifacts, and publishing is done from a terminal with what it produces
# (`scripts/publish.sh`).
#
# The sibling libraries (penfill, terramask, burin-map, deoverlap) are
# checkouts beside this one when developing; here they come from crates.io
# (`scripts/registry-deps.py`).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/registry-deps.py
      - run: cargo test --workspace --exclude drawland-python --exclude drawland-node

  wheels:
    name: Wheel ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/registry-deps.py
      - run: cp LICENSE bindings/python/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/registry-deps.py
      - run: cp LICENSE bindings/python/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: bindings/python/dist

  addon:
    name: Addon ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: "--use-napi-cross" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 ../../scripts/registry-deps.py
      - run: npm install
      - run: npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.cross }} --js native.js --dts native.d.ts
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  # ring's assembly does not cross-compile with napi's toolchain: Linux arm64
  # is built on an arm64 runner, in Debian bullseye for an old glibc (2.31).
  addon-linux-arm64:
    name: Addon aarch64-unknown-linux-gnu
    needs: test
    runs-on: ubuntu-24.04-arm
    container: node:22-bullseye
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 ../../scripts/registry-deps.py
      - run: npm install
      - run: npx napi build --platform --release --target aarch64-unknown-linux-gnu --js native.js --dts native.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: addon-aarch64-unknown-linux-gnu
          path: bindings/node/*.node
          if-no-files-found: error
