<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>draw.land</title>
<style>
  :root { --mono: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
  body.bitmap { background: #fff; }
  main { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  main.dragging { cursor: grabbing; }
  main.pointing { cursor: pointer; }
  main.resting { cursor: default; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #probe { position: absolute; visibility: hidden; white-space: pre; font-family: var(--mono); line-height: 1; }
</style>
</head>
<body>
<main id="main"><canvas id="map"></canvas><canvas id="chrome"></canvas><span id="probe"></span></main>
<script>
// The map moves under the interface: the map is a frame painted from the
// scene (moved here by whole cells until the next one comes), the interface a
// picture of its own, laid out by the server from this page's state and
// drawn in the same cells or pixels, with the zones a press acts on.
const START = /*START*/null
const R = 6378137
// This page, to the server: where its names were (they hold still as it zooms).
const WHO = Math.random().toString(36).slice(2)
const main = document.getElementById("main")
const mapCanvas = document.getElementById("map"), chromeCanvas = document.getElementById("chrome")
const ctx = mapCanvas.getContext("2d"), cctx = chromeCanvas.getContext("2d")
const bitmap = START.kind === "bitmap"
document.body.classList.add(START.kind)

const saved = (k, d) => { try { const v = localStorage.getItem(`drawland.${START.kind}.${k}`); return v === null ? d : JSON.parse(v) } catch { return d } }
const save = (k, v) => { try { localStorage.setItem(`drawland.${START.kind}.${k}`, JSON.stringify(v)) } catch {} }

// Where and how near: from the address bar (#lat,lng,scale), else the profile.
// `scale` is the ground a unit spans, mm, true at the centre's latitude.
const state = { lat: START.lat, lng: START.lng, scale: START.scale }
const fromHash = location.hash.slice(1).split(",").map(Number)
if (fromHash.length === 3 && fromHash.every(Number.isFinite)) [state.lat, state.lng, state.scale] = fromHash
// The interface's state: the server lays it out from this.
const ui = {
  style: saved("style", START.style),
  open: null,
  column: saved("column", false),
  theme: saved("theme", bitmap ? (START.invert ? "ink" : "paper") : "ink"),
  // A bitmap pixel is `size` device pixels; a text cell is `size` CSS px of font.
  size: saved("size", bitmap ? Math.max(1, Math.round(devicePixelRatio)) : 14),
  fit: saved("fit", "window"),
}
const FONT = getComputedStyle(document.getElementById("probe")).fontFamily
// On a bitmap the theme is the paper: ink is white on black.
const inverted = () => bitmap && ui.theme === "ink"

// ---- The grid: how many units the screen holds and how big one is ------

let cellSize = null
function cell() {
  if (cellSize && cellSize.size === ui.size) return cellSize
  const probe = document.getElementById("probe")
  probe.style.fontSize = ui.size + "px"
  probe.textContent = "M".repeat(100)
  const r = probe.getBoundingClientRect()
  return (cellSize = { size: ui.size, w: r.width / 100, h: r.height })
}

// Units across and down, CSS px a unit (a character is one unit across, two
// down), and the screen's box on the page.
function grid() {
  const W = main.clientWidth, H = main.clientHeight
  let w, h, ux, uy, cw, ch
  if (bitmap) {
    ux = uy = ui.size / devicePixelRatio
    cw = ux; ch = uy
  } else {
    const c = cell()
    ux = c.w; uy = c.h / 2
    cw = c.w; ch = c.h
  }
  w = ui.fit === "screen" ? START.width : Math.max(8, Math.floor(W / cw))
  h = ui.fit === "screen" ? START.height : Math.max(4, Math.floor(H / ch))
  const cssW = w * cw, cssH = h * ch
  return { w, h, ux, uy, cw, ch, cssW, cssH, x: Math.round((W - cssW) / 2), y: Math.round((H - cssH) / 2), W, H }
}

// ---- Web Mercator: the page is the Mercator plane scaled at its centre --

const mercator = (lat, lng) => [R * lng * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))]
const geographic = (x, y) => [(2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI, x / R * 180 / Math.PI]
const perUnit = s => s.scale / 1000 / Math.cos(s.lat * Math.PI / 180) // Mercator metres a unit

// Move the map by CSS px (the ground follows the pointer).
function pan(dxCss, dyCss) {
  const g = grid(), per = perUnit(state)
  const [x, y] = mercator(state.lat, state.lng)
  const [lat, lng] = geographic(x - dxCss / g.ux * per, y + dyCss / g.uy * per)
  state.lat = Math.max(-85, Math.min(85, lat))
  state.lng = ((lng + 540) % 360) - 180
  changed()
}

// From ten centimetres a unit to the whole globe on the screen with room
// round it (a 0.85 share of its shorter side), as `globe::clamp` holds it.
function clampScale(scale, g) {
  const units = Math.max(1, Math.min(g.w, bitmap ? g.h : 2 * g.h))
  return Math.max(100, Math.min(Math.max(100, 2 * R * 1000 / (0.85 * units)), scale))
}

// Zoom by `factor` (2 is twice as near), the point under (cx, cy) CSS px held still.
function zoomAt(factor, cx, cy) {
  const g = grid()
  const ox = (cx - g.x - g.cssW / 2) / g.ux, oy = (cy - g.y - g.cssH / 2) / g.uy
  const [x, y] = mercator(state.lat, state.lng), per = perUnit(state)
  const px = x + ox * per, py = y - oy * per
  state.scale = clampScale(state.scale / factor, g)
  // The latitude moves with the centre, and with it the Mercator metres a unit.
  for (let i = 0; i < 2; i++) {
    const per2 = perUnit(state)
    const [lat, lng] = geographic(px - ox * per2, py + oy * per2)
    state.lat = Math.max(-85, Math.min(85, lat)); state.lng = lng
  }
  changed()
}

// ---- Frames: asked one at a time, always for where the map is now -------

// The last frame: its own canvas and the view it shows.
let shown = null
const paper = () => bitmap ? (inverted() !== !!START.invert ? "#000" : "#fff") : (shown?.bg || "#0c0c0c")

let inFlight = false, dirty = true, building = false, lastMs = null, error = ""
async function pump() {
  if (inFlight || !dirty) return
  dirty = false
  inFlight = true
  const g = grid(), at = { ...state }
  const [mx, my] = mercator(at.lat, at.lng)
  const t0 = performance.now()
  try {
    const r = await fetch(`/frame?style=${encodeURIComponent(ui.style)}&who=${WHO}&lng=${at.lng}&lat=${at.lat}&scale=${at.scale}&w=${g.w}&h=${g.h}`)
    if (!r.ok) throw new Error(await r.text())
    building = r.headers.get("X-Scene") === "building"
    const frame = bitmap ? fromPbm(new Uint8Array(await r.arrayBuffer())) : fromRuns(await r.json(), g)
    // The map in the frame is moved by whole cells; it is this far (units)
    // short of the view asked for, less than half a cell: drawn as it is.
    const [dx, dy] = (r.headers.get("X-Shift") || "0,0").split(",").map(Number)
    // A bitmap is drawn at its own size, whatever size was asked for.
    const cssW = bitmap ? frame.canvas.width * g.ux : g.cssW, cssH = bitmap ? frame.canvas.height * g.uy : g.cssH
    const globe = r.headers.get("X-Globe") === "1"
    shown = { ...frame, mx, my, dx, dy, globe, per: perUnit(at), ux: g.ux, uy: g.uy, cssW, cssH }
    lastMs = Math.round(performance.now() - t0)
    error = ""
    draw()
  } catch (e) {
    error = String(e.message || e).split("\n")[0]
  }
  inFlight = false
  chromeDirty = true
  pumpChrome()
  // A wider scene on its way: ask again once it may be there.
  if (building && !dirty) setTimeout(() => { dirty = true; pump() }, 150)
  pump()
}

function fromPbm(bytes) {
  // "P4\n<w> <h>\n" then rows of bits, a set bit black.
  let i = 0, fields = []
  while (fields.length < 3) {
    while (bytes[i] === 0x20 || bytes[i] === 0x0a) i++
    let s = ""
    while (bytes[i] !== 0x20 && bytes[i] !== 0x0a) s += String.fromCharCode(bytes[i++])
    fields.push(s)
  }
  i++
  const w = +fields[1], h = +fields[2], stride = Math.ceil(w / 8)
  const c = new OffscreenCanvas(w, h), cx = c.getContext("2d"), img = cx.createImageData(w, h), d = img.data
  const flip = inverted()
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const black = !!(bytes[i + y * stride + (x >> 3)] & (0x80 >> (x & 7))) !== flip
    const o = (y * w + x) * 4
    d[o] = d[o + 1] = d[o + 2] = black ? 0 : 255; d[o + 3] = 255
  }
  cx.putImageData(img, 0, 0)
  return { canvas: c }
}

function fromRuns(rows, g) {
  const dpr = devicePixelRatio, c = cell(), cw = c.w * dpr, ch = c.h * dpr
  const width = Math.ceil(g.w * cw), height = Math.ceil(rows.length * ch)
  const off = new OffscreenCanvas(width, height), cx = off.getContext("2d")
  cx.fillStyle = "#0c0c0c"; cx.fillRect(0, 0, width, height)
  let bg0 = null
  rows.forEach((runs, y) => {
    let x = 0
    for (const [text, fg, bg] of runs) {
      if (bg0 === null) bg0 = bg
      x += cells(cx, text, fg, bg, x, y, cw, ch)
    }
  })
  return { canvas: off, bg: bg0 }
}

// A run of characters drawn a cell each from cell (x, y); the cells taken.
function cells(cx, text, fg, bg, x, y, cw, ch) {
  const chars = [...text]
  if (bg) { cx.fillStyle = bg; cx.fillRect(Math.floor(x * cw), Math.floor(y * ch), Math.ceil(chars.length * cw) + 1, Math.ceil(ch) + 1) }
  cx.font = `${ui.size * devicePixelRatio}px ${FONT}`
  cx.textBaseline = "middle"; cx.textAlign = "center"
  cx.fillStyle = fg || "#cccccc"
  chars.forEach((t, i) => { if (t !== " ") cx.fillText(t, (x + i + 0.5) * cw, (y + 0.5) * ch) })
  return chars.length
}

// The last frame drawn where the map is now, the map's ground colour round it.
let raf = 0
function draw() {
  raf = 0
  const dpr = devicePixelRatio, g = grid()
  const W = Math.round(g.W * dpr), H = Math.round(g.H * dpr)
  for (const c of [mapCanvas, chromeCanvas]) if (c.width !== W || c.height !== H) { c.width = W; c.height = H }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.fillStyle = paper(); ctx.fillRect(0, 0, g.W, g.H)
  document.body.style.background = paper()
  ctx.save()
  ctx.beginPath(); ctx.rect(g.x, g.y, g.cssW, g.cssH); ctx.clip()
  if (shown) {
    // The medium moves in its own steps: a text screen by whole characters,
    // a bitmap by whole pixels; nothing is scaled. Until the next frame comes
    // the last one is moved by the whole cells the view has gone, if it is
    // the same map at the same scale; a globe turns, it does not slide, so it
    // stays where it is, and so does a frame at another scale.
    // A unit is a pixel on a bitmap; a character is one unit across, two down.
    const per = perUnit(state), [cw, ch] = bitmap ? [1, 1] : [1, 2]
    let ex = shown.dx, ey = shown.dy
    if (!shown.globe && Math.abs(shown.per / per - 1) < 1e-9 && shown.ux === g.ux && shown.uy === g.uy) {
      const [mx, my] = mercator(state.lat, state.lng)
      ex += (shown.mx - mx) / per
      ey -= (shown.my - my) / per
    }
    const ox = Math.round(ex / cw) * cw, oy = Math.round(ey / ch) * ch
    const left = g.x + Math.round((g.cssW - shown.cssW) / 2 / shown.ux) * shown.ux + ox * shown.ux
    const top = g.y + Math.round((g.cssH - shown.cssH) / 2 / shown.uy) * shown.uy + oy * shown.uy
    ctx.imageSmoothingEnabled = false
    const snap = v => Math.round(v * dpr) / dpr
    ctx.drawImage(shown.canvas, snap(left), snap(top), shown.cssW, shown.cssH)
  }
  ctx.restore()
  if (chrome) drawChrome()
  clearTimeout(hashTimer)
  hashTimer = setTimeout(() => history.replaceState(null, "", `#${state.lat.toFixed(5)},${state.lng.toFixed(5)},${Math.round(state.scale)}`), 300)
}
let hashTimer = 0

function changed() {
  dirty = true
  if (!raf) raf = requestAnimationFrame(draw)
  pump()
}

// ---- The interface ------------------------------------------------------

// The last chrome the server laid out: what it covers and its zones.
let chrome = null, chromeDrawn = null
let chromeInFlight = false, chromeDirty = true
async function pumpChrome() {
  if (chromeInFlight || !chromeDirty) return
  chromeDirty = false
  chromeInFlight = true
  const g = grid()
  const q = new URLSearchParams({
    style: ui.style, open: ui.open || "", column: ui.column ? 1 : 0, theme: ui.theme, size: ui.size, fit: ui.fit,
    lat: state.lat, lng: state.lng, scale: state.scale, w: g.w, h: g.h,
    ms: lastMs ?? "", loading: building ? 1 : 0, error,
  })
  try {
    const r = await fetch(`/chrome?${q}`)
    if (r.ok) {
      chrome = await r.json()
      chrome.g = g
      if (bitmap) chrome.planes = { cover: unbase64(chrome.cover), ink: unbase64(chrome.ink), stride: Math.ceil(chrome.w / 8) }
      chromeDrawn = null
      drawChrome()
    }
  } catch {}
  chromeInFlight = false
  pumpChrome()
}

function unbase64(s) { const b = atob(s), out = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) out[i] = b.charCodeAt(i); return out }

// The chrome drawn over the map, fixed: drawn once a layout, kept as a canvas.
function drawChrome() {
  if (!chrome) return
  const dpr = devicePixelRatio, g = grid()
  if (!chromeDrawn) {
    if (bitmap) {
      const { w, h } = chrome, { cover, ink, stride } = chrome.planes
      const c = new OffscreenCanvas(w, h), cx = c.getContext("2d"), img = cx.createImageData(w, h), d = img.data
      const flip = inverted()
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const bit = 0x80 >> (x & 7), at = y * stride + (x >> 3)
        if (!(cover[at] & bit)) continue
        const black = !!(ink[at] & bit) !== flip
        const o = (y * w + x) * 4
        d[o] = d[o + 1] = d[o + 2] = black ? 0 : 255; d[o + 3] = 255
      }
      cx.putImageData(img, 0, 0)
      chromeDrawn = { canvas: c, w: w * g.ux, h: h * g.uy }
    } else {
      const c = cell(), cw = c.w * dpr, ch = c.h * dpr
      const off = new OffscreenCanvas(Math.ceil(chrome.cols * cw), Math.ceil(chrome.rows * ch)), cx = off.getContext("2d")
      chrome.runs.forEach((runs, y) => {
        let x = 0
        for (const run of runs) x += run.length === 1 ? run[0] : cells(cx, run[0], run[1], run[2], x, y, cw, ch)
      })
      chromeDrawn = { canvas: off, w: chrome.cols * c.w, h: chrome.rows * c.h }
    }
  }
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  cctx.clearRect(0, 0, g.W, g.H)
  cctx.imageSmoothingEnabled = false
  cctx.drawImage(chromeDrawn.canvas, g.x, g.y, chromeDrawn.w, chromeDrawn.h)
}

// What the chrome has at CSS px (px, py): the zone's action, and whether it
// covers the map there.
function at(px, py) {
  if (!chrome) return { action: null, covered: false }
  const g = grid()
  let cx, cy, covered
  if (bitmap) {
    const x = Math.floor((px - g.x) / g.ux), y = Math.floor((py - g.y) / g.uy)
    if (x < 0 || y < 0 || x >= chrome.w || y >= chrome.h) return { action: null, covered: false }
    covered = !!(chrome.planes.cover[y * chrome.planes.stride + (x >> 3)] & (0x80 >> (x & 7)))
    cx = Math.min(Math.floor(x / chrome.cell[0]), chrome.cols - 1); cy = Math.min(Math.floor(y / chrome.cell[1]), chrome.rows - 1)
  } else {
    cx = Math.floor((px - g.x) / g.cw); cy = Math.floor((py - g.y) / g.ch)
    if (cx < 0 || cy < 0 || cx >= chrome.cols || cy >= chrome.rows) return { action: null, covered: false }
    let x = 0
    covered = false
    for (const run of chrome.runs[cy]) {
      const n = run.length === 1 ? run[0] : [...run[0]].length
      if (cx < x + n) { covered = run.length !== 1; break }
      x += n
    }
  }
  let action = null
  for (const [x, y, w, h, a] of chrome.zones) if (cx >= x && cx < x + w && cy >= y && cy < y + h) action = a
  return { action, covered }
}

// What a press does: the interface's own actions here, the map's after.
function act(action) {
  const [verb, ...rest] = action.split(":"), arg = rest.join(":")
  const wasOpen = ui.open
  ui.open = null
  switch (verb) {
    case "none": ui.open = wasOpen; return
    case "open": ui.open = wasOpen === arg ? null : arg; break
    case "column": ui.column = !ui.column; save("column", ui.column); break
    case "theme": ui.theme = arg; save("theme", arg); shown = shown && bitmap ? null : shown; dirty = true; break
    case "style": if (arg !== ui.style) { ui.style = arg; save("style", arg); dirty = true } break
    case "size": ui.size = +arg; save("size", ui.size); cellSize = null; dirty = true; break
    case "fit": ui.fit = arg; save("fit", arg); dirty = true; break
    case "zoom": glide(+arg); break
    case "link": window.open(arg, "_blank", "noopener"); break
    case "edit": edit(); break
    case "reload": fetch(`/reload?style=${encodeURIComponent(ui.style)}`).then(() => { dirty = true; pump() }); break
  }
  chromeDirty = true
  changed()
  pumpChrome()
}

function edit() {
  window.open(`/edit?style=${encodeURIComponent(ui.style)}&theme=${encodeURIComponent(ui.theme)}&kind=${START.kind}`, `drawland-edit-${ui.style}`, "width=920,height=760")
}

// The editor says when it saved: the style is drawn anew.
try {
  new BroadcastChannel("drawland").onmessage = e => { if (e.data?.saved === ui.style) { dirty = true; pump() } }
} catch {}

// ---- Input -------------------------------------------------------------

let drag = null
main.addEventListener("pointerdown", e => {
  e.preventDefault()
  const r = main.getBoundingClientRect(), hit = at(e.clientX - r.left, e.clientY - r.top)
  if (hit.action) return act(hit.action)
  if (hit.covered) return
  if (ui.open) { ui.open = null; chromeDirty = true; pumpChrome() }
  drag = { x: e.clientX, y: e.clientY }
  main.setPointerCapture(e.pointerId)
  main.classList.add("dragging")
})
main.addEventListener("pointermove", e => {
  if (!drag) {
    const r = main.getBoundingClientRect(), hit = at(e.clientX - r.left, e.clientY - r.top)
    main.classList.toggle("pointing", !!hit.action && hit.action !== "none")
    main.classList.toggle("resting", !hit.action && hit.covered)
    return
  }
  pan(e.clientX - drag.x, e.clientY - drag.y)
  drag = { x: e.clientX, y: e.clientY }
})
const release = () => { drag = null; main.classList.remove("dragging") }
main.addEventListener("pointerup", release)
main.addEventListener("pointercancel", release)
main.addEventListener("dragstart", e => e.preventDefault())

// The wheel and a trackpad's pinch zoom where the pointer is.
main.addEventListener("wheel", e => {
  e.preventDefault()
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1
  const k = e.ctrlKey ? 0.01 : 0.002
  const r = main.getBoundingClientRect()
  zoomAt(Math.exp(-e.deltaY * unit * k), e.clientX - r.left, e.clientY - r.top)
}, { passive: false })

// Buttons and keys zoom twice as near or far, in a short glide.
function glide(steps) {
  const r = main.getBoundingClientRect(), total = Math.pow(2, steps), t0 = performance.now(), T = 220
  let done = 1
  const step = now => {
    const t = Math.min(1, (now - t0) / T), eased = 1 - Math.pow(1 - t, 3)
    const want = Math.pow(total, eased)
    zoomAt(want / done, r.width / 2, r.height / 2)
    done = want
    if (t < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

const MOVES = { ArrowLeft: [1, 0], h: [1, 0], ArrowRight: [-1, 0], l: [-1, 0], ArrowUp: [0, 1], k: [0, 1], ArrowDown: [0, -1], j: [0, -1] }
const KEYS = { s: "open:style", t: "open:theme", f: "open:size", p: "column", "\\": "column", e: "edit" }
const held = new Set()
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  if (MOVES[e.key]) { e.preventDefault(); if (!held.size) requestAnimationFrame(glideKeys); held.add(e.key); return }
  if (e.key === "+" || e.key === "=") glide(1)
  else if (e.key === "-" || e.key === "_") glide(-1)
  else if (e.key === "Escape" && ui.open) { ui.open = null; chromeDirty = true; pumpChrome() }
  else if (KEYS[e.key]) act(KEYS[e.key])
})
addEventListener("keyup", e => held.delete(e.key))
addEventListener("blur", () => held.clear())
// Held arrows move the map steadily: a third of the screen a second.
let lastKey = 0
function glideKeys(now) {
  if (!held.size) { lastKey = 0; return }
  const dt = lastKey ? Math.min(50, now - lastKey) / 1000 : 1 / 60
  lastKey = now
  const g = grid(), v = Math.min(g.W, g.H) * 0.6 * dt
  let dx = 0, dy = 0
  for (const k of held) { const d = MOVES[k]; if (d) { dx += d[0]; dy += d[1] } }
  pan(dx * v, dy * v)
  requestAnimationFrame(glideKeys)
}

addEventListener("resize", () => { chromeDirty = true; changed(); pumpChrome() })
changed()
pumpChrome()
</script>
</body>
</html>
