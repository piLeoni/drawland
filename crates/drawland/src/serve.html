<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>draw.land</title>
<style>
  :root {
    --bg: #0c0c0c; --fg: #cfcfcf; --dim: #7a7a7a; --bar: #141414; --line: #262626;
    --mono: ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  }
  body.bitmap { --bg: #d9d7d0; --fg: #111; --dim: #6b6a65; --bar: #ecebe6; --line: #c9c7bf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px/1.4 var(--mono); }
  body { display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 12px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  header .group { display: flex; align-items: center; gap: 4px; }
  header .label { color: var(--dim); margin-right: 2px; }
  header .status { color: var(--dim); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button[aria-pressed="true"] { background: var(--fg); color: var(--bar); border-color: var(--fg); }
  main { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  main.dragging { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #probe { position: absolute; visibility: hidden; white-space: pre; font-family: var(--mono); line-height: 1; }
  @media (max-width: 600px) { header .status { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="group" id="sizes"></div>
  <div class="group"><span class="label">size</span><button data-fit="window">window</button><button data-fit="screen"></button></div>
  <div class="group"><span class="label">zoom</span><button data-zoom="1">+</button><button data-zoom="-1">−</button></div>
  <div class="status" id="status"></div>
</header>
<main id="main"><canvas id="screen"></canvas><span id="probe"></span></main>
<script>
const START = /*START*/null
const R = 6378137
const main = document.getElementById("main"), canvas = document.getElementById("screen"), statusEl = document.getElementById("status")
const ctx = canvas.getContext("2d")
const bitmap = START.kind === "bitmap"
document.body.classList.add(START.kind)
document.getElementById("title").textContent = START.title
document.querySelector('[data-fit="screen"]').textContent = `${START.width}×${START.height}`

const saved = (k, d) => { try { const v = localStorage.getItem(`drawland.${START.kind}.${k}`); return v === null ? d : JSON.parse(v) } catch { return d } }
const save = (k, v) => { try { localStorage.setItem(`drawland.${START.kind}.${k}`, JSON.stringify(v)) } catch {} }

// Where and how near: from the address bar (#lat,lng,scale), else the profile.
// `scale` is the ground a unit spans, mm, true at the centre's latitude.
const state = { lat: START.lat, lng: START.lng, scale: START.scale }
const fromHash = location.hash.slice(1).split(",").map(Number)
if (fromHash.length === 3 && fromHash.every(Number.isFinite)) [state.lat, state.lng, state.scale] = fromHash
// A bitmap pixel is `size` device pixels; a text cell is `size` CSS px of font.
let size = saved("size", bitmap ? Math.max(1, Math.round(devicePixelRatio)) : 14)
let fit = saved("fit", "window")
const SIZES = bitmap ? [1, 2, 3, 4, 6, 8] : [10, 12, 14, 16, 20, 24]
const FONT = getComputedStyle(document.getElementById("probe")).fontFamily

const sizes = document.getElementById("sizes")
sizes.innerHTML = `<span class="label">${bitmap ? "pixel" : "font"}</span>` +
  SIZES.map(s => `<button data-size="${s}" title="${bitmap ? `a pixel is ${s} device pixel${s > 1 ? "s" : ""}` : `${s}px`}">${bitmap ? "×" + s : s}</button>`).join("")
function pressed() {
  for (const b of sizes.querySelectorAll("button")) b.setAttribute("aria-pressed", String(+b.dataset.size === size))
  for (const b of document.querySelectorAll("[data-fit]")) b.setAttribute("aria-pressed", String(b.dataset.fit === fit))
}

// ---- The grid: how many units the screen holds and how big one is ------

let cellSize = null
function cell() {
  if (cellSize && cellSize.size === size) return cellSize
  const probe = document.getElementById("probe")
  probe.style.fontSize = size + "px"
  probe.textContent = "M".repeat(100)
  const r = probe.getBoundingClientRect()
  return (cellSize = { size, w: r.width / 100, h: r.height })
}

// Units across and down, CSS px a unit (a character is one unit across, two
// down), and the screen's box on the page.
function grid() {
  const W = main.clientWidth, H = main.clientHeight
  let w, h, ux, uy, cw, ch
  if (bitmap) {
    ux = uy = size / devicePixelRatio
    cw = ux; ch = uy
  } else {
    const c = cell()
    ux = c.w; uy = c.h / 2
    cw = c.w; ch = c.h
  }
  w = fit === "screen" ? START.width : Math.max(4, Math.floor(W / cw))
  h = fit === "screen" ? START.height : Math.max(2, Math.floor(H / ch))
  const cssW = w * cw, cssH = h * ch
  return { w, h, ux, uy, cssW, cssH, x: Math.round((W - cssW) / 2), y: Math.round((H - cssH) / 2), W, H }
}

// ---- Web Mercator: the page is the Mercator plane scaled at its centre --

const mercator = (lat, lng) => [R * lng * Math.PI / 180, R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360))]
const geographic = (x, y) => [(2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI, x / R * 180 / Math.PI]
const perUnit = s => s.scale / 1000 / Math.cos(s.lat * Math.PI / 180) // Mercator metres a unit

// Move the map by CSS px (the ground follows the pointer).
function pan(dxCss, dyCss) {
  const g = grid(), per = perUnit(state)
  const [x, y] = mercator(state.lat, state.lng)
  const [lat, lng] = geographic(x - dxCss / g.ux * per, y + dyCss / g.uy * per)
  state.lat = Math.max(-85, Math.min(85, lat))
  state.lng = ((lng + 540) % 360) - 180
  changed()
}

// Zoom by `factor` (2 is twice as near), the point under (cx, cy) CSS px held still.
function zoomAt(factor, cx, cy) {
  const g = grid()
  const ox = (cx - g.x - g.cssW / 2) / g.ux, oy = (cy - g.y - g.cssH / 2) / g.uy
  const [x, y] = mercator(state.lat, state.lng), per = perUnit(state)
  const px = x + ox * per, py = y - oy * per
  state.scale = Math.max(100, Math.min(1e8, state.scale / factor))
  // The latitude moves with the centre, and with it the Mercator metres a unit.
  for (let i = 0; i < 2; i++) {
    const per2 = perUnit(state)
    const [lat, lng] = geographic(px - ox * per2, py + oy * per2)
    state.lat = Math.max(-85, Math.min(85, lat)); state.lng = lng
  }
  changed()
}

function ground() {
  const m = state.scale / 1000, unit = bitmap ? "pixel" : "character"
  return m >= 1000 ? `${(m / 1000).toFixed(1)} km a ${unit}` : m >= 10 ? `${m.toFixed(0)} m a ${unit}` : `${m.toFixed(1)} m a ${unit}`
}

// ---- Frames: asked one at a time, always for where the map is now -------

// The last frame: its own canvas and the view it shows.
let shown = null
const paper = () => bitmap ? (START.invert ? "#000" : "#fff") : (shown?.bg || "#0c0c0c")

let inFlight = false, dirty = true, building = false, lastMs = 0
async function pump() {
  if (inFlight || !dirty) return
  dirty = false
  inFlight = true
  const g = grid(), at = { ...state }
  const [mx, my] = mercator(at.lat, at.lng)
  const t0 = performance.now()
  try {
    const r = await fetch(`/frame?lng=${at.lng}&lat=${at.lat}&scale=${at.scale}&w=${g.w}&h=${g.h}`)
    if (!r.ok) throw new Error(await r.text())
    building = r.headers.get("X-Scene") === "building"
    const frame = bitmap ? fromPbm(new Uint8Array(await r.arrayBuffer())) : fromRuns(await r.json(), g)
    shown = { ...frame, mx, my, per: perUnit(at), ux: g.ux, uy: g.uy, cssW: g.cssW, cssH: g.cssH }
    lastMs = Math.round(performance.now() - t0)
    draw()
  } catch (e) {
    statusEl.textContent = String(e.message || e)
  }
  inFlight = false
  // A wider scene on its way: ask again once it may be there.
  if (building && !dirty) setTimeout(() => { dirty = true; pump() }, 150)
  pump()
}

function fromPbm(bytes) {
  // "P4\n<w> <h>\n" then rows of bits, a set bit black.
  let i = 0, fields = []
  while (fields.length < 3) {
    while (bytes[i] === 0x20 || bytes[i] === 0x0a) i++
    let s = ""
    while (bytes[i] !== 0x20 && bytes[i] !== 0x0a) s += String.fromCharCode(bytes[i++])
    fields.push(s)
  }
  i++
  const w = +fields[1], h = +fields[2], stride = Math.ceil(w / 8)
  const c = new OffscreenCanvas(w, h), cx = c.getContext("2d"), img = cx.createImageData(w, h), d = img.data
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = bytes[i + y * stride + (x >> 3)] & (0x80 >> (x & 7)) ? 0 : 255
    const o = (y * w + x) * 4
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255
  }
  cx.putImageData(img, 0, 0)
  return { canvas: c, smooth: false }
}

function fromRuns(rows, g) {
  const dpr = devicePixelRatio, c = cell(), cw = c.w * dpr, ch = c.h * dpr
  const width = Math.ceil(g.w * cw), height = Math.ceil(rows.length * ch)
  const off = new OffscreenCanvas(width, height), cx = off.getContext("2d")
  cx.fillStyle = "#0c0c0c"; cx.fillRect(0, 0, width, height)
  cx.font = `${size * dpr}px ${FONT}`
  cx.textBaseline = "middle"; cx.textAlign = "center"
  let bg0 = null
  rows.forEach((runs, y) => {
    let x = 0
    for (const [text, fg, bg] of runs) {
      const chars = [...text]
      if (bg) { cx.fillStyle = bg; cx.fillRect(Math.floor(x * cw), Math.floor(y * ch), Math.ceil(chars.length * cw) + 1, Math.ceil(ch) + 1) }
      if (bg0 === null) bg0 = bg
      cx.fillStyle = fg || "#cccccc"
      chars.forEach((t, i) => { if (t !== " ") cx.fillText(t, (x + i + 0.5) * cw, (y + 0.5) * ch) })
      x += chars.length
    }
  })
  return { canvas: off, smooth: true, bg: bg0 }
}

// The last frame drawn where the map is now: moved and scaled by what changed
// since, the map's ground colour round it.
let raf = 0
function draw() {
  raf = 0
  const dpr = devicePixelRatio, g = grid()
  const W = Math.round(g.W * dpr), H = Math.round(g.H * dpr)
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.clearRect(0, 0, g.W, g.H)
  ctx.save()
  ctx.beginPath(); ctx.rect(g.x, g.y, g.cssW, g.cssH); ctx.clip()
  ctx.fillStyle = paper(); ctx.fillRect(g.x, g.y, g.cssW, g.cssH)
  if (shown) {
    const per = perUnit(state), [mx, my] = mercator(state.lat, state.lng)
    const sx = shown.per / per * g.ux / shown.ux, sy = shown.per / per * g.uy / shown.uy
    const left = g.x + g.cssW / 2 - shown.cssW / 2 * sx + (shown.mx - mx) / per * g.ux
    const top = g.y + g.cssH / 2 - shown.cssH / 2 * sy - (shown.my - my) / per * g.uy
    ctx.imageSmoothingEnabled = shown.smooth && Math.abs(sx - 1) > 1e-6
    // Whole device pixels while the scale holds, so a bitmap stays sharp.
    const snap = v => Math.round(v * dpr) / dpr
    ctx.drawImage(shown.canvas, snap(left), snap(top), shown.cssW * sx, shown.cssH * sy)
  }
  ctx.restore()
  status()
}

let hashTimer = 0
function status() {
  const g = grid()
  statusEl.textContent = `${state.lat.toFixed(5)}, ${state.lng.toFixed(5)} · ${ground()} · ${g.w}×${g.h} · ${lastMs} ms${building ? " · loading the area round it…" : ""}`
  clearTimeout(hashTimer)
  hashTimer = setTimeout(() => history.replaceState(null, "", `#${state.lat.toFixed(5)},${state.lng.toFixed(5)},${Math.round(state.scale)}`), 300)
}

function changed() {
  dirty = true
  if (!raf) raf = requestAnimationFrame(draw)
  pump()
}

// ---- Input -------------------------------------------------------------

let drag = null
main.addEventListener("pointerdown", e => {
  e.preventDefault()
  drag = { x: e.clientX, y: e.clientY }
  main.setPointerCapture(e.pointerId)
  main.classList.add("dragging")
})
main.addEventListener("pointermove", e => {
  if (!drag) return
  pan(e.clientX - drag.x, e.clientY - drag.y)
  drag = { x: e.clientX, y: e.clientY }
})
const release = () => { drag = null; main.classList.remove("dragging") }
main.addEventListener("pointerup", release)
main.addEventListener("pointercancel", release)
main.addEventListener("dragstart", e => e.preventDefault())

// The wheel and a trackpad's pinch zoom where the pointer is.
main.addEventListener("wheel", e => {
  e.preventDefault()
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1
  const k = e.ctrlKey ? 0.01 : 0.002
  const r = main.getBoundingClientRect()
  zoomAt(Math.exp(-e.deltaY * unit * k), e.clientX - r.left, e.clientY - r.top)
}, { passive: false })

// Buttons and keys zoom twice as near or far, in a short glide.
function glide(steps) {
  const r = main.getBoundingClientRect(), total = Math.pow(2, steps), t0 = performance.now(), T = 220
  let done = 1
  const step = now => {
    const t = Math.min(1, (now - t0) / T), eased = 1 - Math.pow(1 - t, 3)
    const want = Math.pow(total, eased)
    zoomAt(want / done, r.width / 2, r.height / 2)
    done = want
    if (t < 1) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

const held = new Set()
addEventListener("keydown", e => {
  const dir = { ArrowLeft: [1, 0], h: [1, 0], a: [1, 0], ArrowRight: [-1, 0], l: [-1, 0], d: [-1, 0], ArrowUp: [0, 1], k: [0, 1], w: [0, 1], ArrowDown: [0, -1], j: [0, -1], s: [0, -1] }[e.key]
  if (dir) { e.preventDefault(); if (!held.size) requestAnimationFrame(glideKeys); held.add(e.key); return }
  if (e.key === "+" || e.key === "=") glide(1)
  else if (e.key === "-" || e.key === "_") glide(-1)
})
addEventListener("keyup", e => held.delete(e.key))
addEventListener("blur", () => held.clear())
// Held arrows move the map steadily: a third of the screen a second.
let lastKey = 0
function glideKeys(now) {
  if (!held.size) { lastKey = 0; return }
  const dt = lastKey ? Math.min(50, now - lastKey) / 1000 : 1 / 60
  lastKey = now
  const g = grid(), v = Math.min(g.W, g.H) * 0.6 * dt
  let dx = 0, dy = 0
  for (const k of held) {
    const d = { ArrowLeft: [1, 0], h: [1, 0], a: [1, 0], ArrowRight: [-1, 0], l: [-1, 0], d: [-1, 0], ArrowUp: [0, 1], k: [0, 1], w: [0, 1], ArrowDown: [0, -1], j: [0, -1], s: [0, -1] }[k]
    if (d) { dx += d[0]; dy += d[1] }
  }
  pan(dx * v, dy * v)
  requestAnimationFrame(glideKeys)
}

document.addEventListener("click", e => {
  const b = e.target.closest("button")
  if (!b) return
  if (b.dataset.zoom) return glide(+b.dataset.zoom)
  if (b.dataset.size) { size = +b.dataset.size; save("size", size) }
  if (b.dataset.fit) { fit = b.dataset.fit; save("fit", fit) }
  pressed()
  changed()
})

addEventListener("resize", changed)
pressed()
changed()
</script>
</body>
</html>
