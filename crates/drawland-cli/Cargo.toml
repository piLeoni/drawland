[package]
name = "drawland-cli"
description = "draw.land's command line: `drawland map` draws a profile at a place as a layered pen-plotter SVG"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["plotter", "map", "openstreetmap", "svg", "cli"]
categories = ["graphics", "science::geo", "command-line-utilities"]

[[bin]]
name = "drawland"
path = "src/main.rs"

[dependencies]
drawland = { workspace = true }
