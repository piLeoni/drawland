[package]
name = "drawland-grid"
description = "draw.land on a screen (experimental): a map's layers painted into a 1-bit bitmap or a grid of text cells (ANSI, HTML)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["map", "openstreetmap", "ascii", "bitmap", "1-bit"]
categories = ["graphics", "science::geo"]
include = ["src/**", "fonts/**", "Cargo.toml"]

[dependencies]
drawland-core = { workspace = true }
geo = { workspace = true }
png = { workspace = true }
deunicode = { workspace = true }
